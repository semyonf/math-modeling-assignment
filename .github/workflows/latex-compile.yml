name: LaTeX Compilation Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-lang-cyrillic \
          texlive-fonts-recommended \
          texlive-science \
          texlive-pictures \
          gfortran

    - name: Build program, generate data and compile report
      run: |
        # программа завершается с ошибкой, если решение методом Эйлера расходится
        # с точной переходной характеристикой или GZ1 не находит минимум тестовых функций
        make all

    - name: Verify generated data
      run: |
        for f in theor exact exp1 exp2 exp3 final rng-hist opt-ellipse opt-rosenbrock opt-cf1 opt-cf2 opt-cf3; do
          test -f "data/$f.csv"
        done
        test -f data/results.tex
        ls -lh out/report.pdf

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-report
        path: out/report.pdf
        retention-days: 30

    - name: Verify PDF size
      run: |
        SIZE=$(stat -f%z out/report.pdf 2>/dev/null || stat -c%s out/report.pdf)
        echo "PDF size: $SIZE bytes"
        if [ "$SIZE" -lt 10000 ]; then
          echo "Error: PDF file is suspiciously small"
          exit 1
        fi
        echo "PDF compilation successful!"
