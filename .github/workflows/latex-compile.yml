name: LaTeX Compilation Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-lang-cyrillic \
          texlive-fonts-recommended \
          texlive-science \
          gfortran

    - name: Create required directories
      run: |
        mkdir -p data program/bin out

    - name: Compile Fortran program
      run: |
        gfortran -Wall -std=f2008ts -fimplicit-none \
          -Wno-maybe-uninitialized -Wintrinsics-std \
          -static-libgfortran -flto \
          program/calc.f08 -o program/bin/calc

    - name: Run Fortran program to generate data
      run: |
        ./program/bin/calc

    - name: Verify data files were generated
      run: |
        test -f data/theor.csv
        test -f data/exp1.csv
        test -f data/exp2.csv
        test -f data/exp3.csv
        test -f data/final.csv
        echo "All required data files generated successfully"

    - name: Compile LaTeX document
      run: |
        pdflatex -interaction=nonstopmode -halt-on-error report.tex
        pdflatex -interaction=nonstopmode -halt-on-error report.tex

    - name: Move PDF to output directory
      run: |
        mv report.pdf out/
        ls -lh out/report.pdf

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-report
        path: out/report.pdf
        retention-days: 30

    - name: Verify PDF size
      run: |
        SIZE=$(stat -f%z out/report.pdf 2>/dev/null || stat -c%s out/report.pdf)
        echo "PDF size: $SIZE bytes"
        if [ "$SIZE" -lt 10000 ]; then
          echo "Error: PDF file is suspiciously small"
          exit 1
        fi
        echo "PDF compilation successful!"
